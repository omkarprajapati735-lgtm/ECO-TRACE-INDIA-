services:
  - type: web
    name: ecotrace-backend-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: ecotrace-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ecotrace-redis-cache
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://ecotrace-frontend.vercel.app

  - type: redis
    name: ecotrace-redis-cache
    plan: starter
    region: singapore
    ipAllowList: []

databases:
  - name: ecotrace-postgres
    databaseName: ecotrace_db
    user: ecotrace_admin
    plan: starter
    region: singapore
