version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecotrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecotrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecotrace_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ecotrace_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-ecotrace} -d $${POSTGRES_DB:-ecotrace_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecotrace-network

  redis:
    image: redis:7-alpine
    container_name: ecotrace-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecotrace-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecotrace-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecotrace}:${POSTGRES_PASSWORD:-ecotrace_secret}@postgres:5432/${POSTGRES_DB:-ecotrace_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-ecotrace_super_secure_access_secret_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-ecotrace_super_secure_refresh_secret_2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecotrace-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ecotrace-network:
    driver: bridge
